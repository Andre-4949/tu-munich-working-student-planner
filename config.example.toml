# Example configuration with fictional values.
#
#   cp config.example.toml config.toml     (config.toml is git-ignored)
#
# Durations are whole minutes. Clock times are quoted "HH:MM".
# Keys marked "optional" may be deleted; the default is used then.

[travel]
# Required: travel times in minutes.
home_to_tum = 40        # home -> TUM (door to lecture hall)
tum_to_job = 30         # TUM -> job
# Optional:
job_to_tum = 30         # job -> TUM. Default: same as tum_to_job
home_to_job = 70        # home -> job directly, used before the first lecture. Default: home_to_tum + tum_to_job
job_to_home = 70       # job -> home. Only used to draw the last travel block of a day. Default: home_to_job

[car]
# Optional: you have a car. Each car leg takes its own time (minutes). Remove this section
# to plan with public transport only. The car starts at home each day; once you drive it out
# it stays with you until you are home again.
home_to_tum = 25        # required
home_to_job = 45        # required
tum_to_job = 45         # required
# Optional: fuel estimate per car day. Give all three or none.
distance_in_km = 20          # one-way driving distance of every car leg, km
liters_per_100km = 7.0       # fuel consumption of your car
fuel_price_per_liter = 1.80  # EUR per liter
# Optional, default: the same as the value in the other direction
# job_to_tum = 45
# job_to_home = 45
# tum_to_home = 25

[schedule]
# Required:
earliest_wake_up = "06:45"   # earliest time you get up on a work day
latest_at_job = "17:00"      # latest time you may still be at the job
min_time_at_company = 90     # shortest work block worth the trip (minutes)
# Optional:
ready_minutes = 30           # time between getting up and leaving home. Default: 0
earliest_at_job = "08:00"    # office opens; no work before this. Default: no limit
max_shift_minutes = 600      # longest single work block. Default: no limit
buffer_minutes = 10          # extra minutes kept free on each side of a work block that touches a lecture. Default: 0
work_days = ["mon", "tue", "wed", "thu", "fri"]   # weekdays you can work. Default: Monday to Friday
weekly_target_hours = 10     # hours the planner fills up to each week (the choice of days is optimised for it). Default: none
break_minutes = 30           # unpaid break inside each visit (minutes); max_shift_minutes is work time. Default: 0
max_hours_per_week = 10     # legal or personal maximum; never planned above it. Default: the weekly target

[lectures]
# Sessions of these courses are ignored and do not block time.
# LV_NUMMER as written in the TUMonline export (leading zeros are ignored).
not_attended = ["0000000001"]
# Optional: skip only some session types of a course, as "LV_NUMMER:LV_ART".
sessions_not_attended = []
# Optional: true draws skipped sessions faded and hatched in the PDF, false hides them. Default: true
show_skipped = true

[holidays]
# Optional: dates or ranges (inclusive) without work, e.g. holidays or a vacation.
no_work = ["2026-11-10"]
# Optional: dates or ranges when the company is closed. Lectures still happen; no work is planned.
company_closed = ["2026-12-24..2027-01-01"]
# Optional: a timed blocker on one day, e.g. an exam. No work that day before the end time.
# no_work_durations = ["2026-12-15 10:00..10:30"]

# Optional: change the values for one weekday only.
# Table names: mon, tue, wed, thu, fri, sat, sun
# Optional: first and last day of the planned calendar. Default: the first and last session of the export.
# [calendar]
# start = "2026-11-02"
# end = "2026-11-20"

[day_overrides.fri]
latest_at_job = "14:00"
